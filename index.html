<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Top Rope Solo - Tromsø</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #000;
            --muted: #6b6b6b;
            --dark-grey: #2c3e50;
            --switch-grey: #cbd5e1;
            --winter-bg: #dde9f2;
            --winter-ink: #3f6f93;
            --summer-bg: #e6efd8;
            --map-bg: #ededeb;
        }

        body {
            font-family: "Jost", "Helvetica Neue", Arial, sans-serif; font-weight: 300;
            text-align: center; margin: 0; padding: 10px 5px;
            background: #fff; color: var(--ink);
            overflow-x: hidden; display: flex; flex-direction: column;
        }
        button, select { font-family: inherit; }
        [hidden] { display: none !important; }

        h1, .buttons-wrapper > #buttons, #controls-row, #bottom-controls-row {
            width: 100%; max-width: 1100px; margin-left: auto; margin-right: auto; box-sizing: border-box;
        }
        h1 { order: 1; display: flex; align-items: center; gap: 14px; margin-top: 22px; margin-bottom: 18px; padding: 0 2px 16px; text-align: left; font-size: clamp(30px, 6vw, 44px); font-weight: 200; letter-spacing: -.02em; line-height: 1.1; border-bottom: 1px solid var(--ink); }
        h1 .h-ico { flex: none; width: 38px; height: 38px; fill: none; stroke: var(--winter-ink); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }

        .buttons-wrapper { position: relative; width: 100%; order: 4; margin-bottom: 15px; z-index: 9999; }
        #buttons { display: flex; justify-content: flex-start; gap: 8px; flex-wrap: wrap; padding: 5px 2px; }
        #controls-row { display: flex; justify-content: flex-start; align-items: center; gap: 10px; margin-bottom: 15px; padding: 0 2px; flex-wrap: wrap; order: 5; position: relative; z-index: 10; }
        #map-container { position: relative; max-width: 1100px; margin: 0 auto; width: 100%; order: 7; z-index: 1; }
        #bottom-controls-row { display: flex; justify-content: flex-start; align-items: center; gap: 10px; margin-top: 15px; padding: 0 2px; flex-wrap: wrap; order: 8; position: relative; z-index: 10; }

        #map { height: 65vh; min-height: 450px; width: 100%; border-radius: 0; box-shadow: none; outline: 1px solid var(--ink); }

        /* ===== Panelet over kartet ===== */
        #video-buttons-container {
            position: absolute; top: 2px; right: 2px; z-index: 1000;
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-items: stretch;
            width: 300px; box-sizing: border-box;
            max-height: calc(100% - 20px); overflow-y: auto; overflow-x: hidden;
            overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
            padding: 8px 8px 4px 0; scrollbar-width: thin;
        }
        #video-buttons-container:empty { display: none; }
        #video-buttons-container > * { grid-column: 1 / -1; min-width: 0; }
        #video-buttons-container > .video-link-btn,
        #video-buttons-container > .search-link-btn,
        #video-buttons-container > .download-area:not(.open) { grid-column: auto; }
        #video-buttons-container > .btn-full,
        #video-buttons-container > .download-area.btn-full,
        #video-buttons-container > .download-area.open { grid-column: 1 / -1; }
        #video-buttons-container > .menu-top-row { order: 0; }
        #video-buttons-container > .control-row-container { order: 1; }
        #video-buttons-container > .desc-box { order: 3; }
        #video-buttons-container > .gps-box { order: 3; }
        #video-buttons-container > .video-grid { order: 2; }
        #video-buttons-container > .video-link-btn,
        #video-buttons-container > .search-link-btn { order: 4; }
        #video-buttons-container > .download-area { order: 6; }

        .spor-rad { order: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; }
        .spor-rad > .control-row-container { min-width: 0; }
        .menu-top-row { display: flex; gap: 6px; width: 100%; justify-content: flex-end; }
        .toggle-ui-btn { background: var(--ink); color: white; border: none; padding: 6px 12px; border-radius: 0; font-size: 11px; font-weight: 500; cursor: pointer; opacity: .9; }
        .toggle-ui-btn:hover { opacity: 1; }
        .share-ui-btn { background: #fff; color: var(--ink); border: 1px solid var(--ink); padding: 6px 10px; border-radius: 0; font-size: 11px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: background .3s ease; }
        .share-ui-btn:hover { background: var(--winter-bg); }

        .ui-hidden .video-link-btn, .ui-hidden .control-row-container, .ui-hidden .search-link-btn,
        .ui-hidden .spor-rad, .ui-hidden .download-area, .ui-hidden .desc-box, .ui-hidden .gps-box, .ui-hidden .video-grid { display: none !important; }

        .video-link-btn, .search-link-btn {
            background: rgba(255,255,255,.95); padding: 5px 8px; border-radius: 0;
            font-weight: 500; text-decoration: none; font-size: 11px; line-height: 1.2;
            border: 1px solid var(--ink); color: var(--ink);
            display: flex; align-items: center; gap: 4px;
            width: 100%; box-sizing: border-box; backdrop-filter: blur(4px); cursor: pointer; min-height: 32px;
            font-family: inherit; text-align: left; transition: background .3s ease;
        }
        .video-link-btn:hover, .search-link-btn:hover { background: var(--winter-bg); }
        .video-grid { display: grid; gap: 6px; grid-template-columns: repeat(3, 1fr); }
        .video-tile { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; aspect-ratio: 1 / 1; padding: 10px 6px 8px; box-sizing: border-box; text-decoration: none; color: var(--ink); background: rgba(255,255,255,.95); backdrop-filter: blur(4px); border: 1px solid var(--ink); border-radius: 0; box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 4px #c9d6e0; transition: background .3s ease, box-shadow .3s ease; text-align: center; }
        .video-tile:hover, .video-tile:focus-visible { background: var(--winter-bg); box-shadow: inset 0 0 0 3px var(--winter-bg), inset 0 0 0 4px var(--winter-ink); outline: none; }
        .video-tile .vt-ikon { width: 30px; height: 30px; fill: none; stroke: var(--winter-ink); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; transition: stroke .3s ease; }
        .video-tile:hover .vt-ikon { stroke: var(--ink); }
        .video-tile .vt-navn { font-size: 11px; font-weight: 500; line-height: 1.2; word-break: break-word; }
        .video-tile .badge-label { top: 3px; right: 3px; }
        .video-tile.har-bilde, .video-tile.har-bilde:hover { background-color: #fff; background-size: cover; background-position: center; background-repeat: no-repeat; aspect-ratio: 1 / 1; justify-content: flex-end; padding: 0; gap: 0; overflow: hidden; box-shadow: inset 0 0 0 3px rgba(255,255,255,.9), inset 0 0 0 4px #c9d6e0; }
        .video-tile.har-bilde::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,.18); transition: background .3s ease; }
        .video-tile.har-bilde:hover::before, .video-tile.har-bilde:focus-visible::before { background: rgba(63,111,147,.28); }
        .video-tile.har-bilde .vt-ikon { position: absolute; top: calc(50% - 15px); left: calc(50% - 15px); width: 30px; height: 30px; stroke: #fff; stroke-width: 1.6; filter: drop-shadow(0 0 3px rgba(0,0,0,.65)); }
        .video-tile.har-bilde:hover .vt-ikon { stroke: #fff; }
        .video-tile.har-bilde .vt-navn { position: relative; width: 100%; box-sizing: border-box; padding: 3px 5px; background: rgba(255,255,255,.93); border-top: 1px solid var(--ink); }
        .vt-embed { position: absolute; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; background: #fff; }
        .vt-embed blockquote { position: absolute; left: 0; top: 0; width: 326px; margin: 0; padding: 0; opacity: 0; pointer-events: none; }
        .vt-embed iframe { position: absolute; left: 0; top: 0; width: 326px !important; min-width: 326px !important; max-width: none !important; margin: 0 !important; border: 0 !important; border-radius: 0 !important; box-shadow: none !important; transform-origin: 0 0; transform: scale(var(--s, .3)) translateY(-56px); pointer-events: none; }
        .video-tile.har-embed::before { z-index: 1; background: rgba(0,0,0,.08); }
        .video-tile.har-embed:hover::before, .video-tile.har-embed:focus-visible::before { background: rgba(63,111,147,.25); }
        .video-tile.har-embed .vt-ikon { display: none; }
        .video-tile.har-embed .vt-navn { z-index: 2; }
        .suunto-icon { color: #ff3b30; font-size: 10px; }
        .video-link-btn .badge-label { position: static; margin-left: auto; flex-shrink: 0; }

        .desc-box, .gps-box {
            background: rgba(255,255,255,.95); padding: 6px 8px; border-radius: 0;
            border: 1px solid var(--ink); width: 100%; box-sizing: border-box; backdrop-filter: blur(4px);
            text-align: left; font-size: 11px; color: var(--ink); line-height: 1.35; font-weight: 400;
        }
        .desc-box-title { font-weight: 500; font-size: 11px; color: var(--muted); margin-bottom: 4px; display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; }
        .desc-box-title .chev, .download-header .chev { margin-left: auto; font-size: 9px; transition: transform .2s; }
        .desc-box.collapsed .desc-box-title { margin-bottom: 0; }
        .desc-box.collapsed .desc-box-body { display: none; }
        .desc-box.collapsed .chev, .download-area:not(.open) .chev { transform: rotate(-90deg); }
        .desc-box-body .tom { color: var(--muted); font-style: italic; }

        .gps-box .gps-rad { display: flex; align-items: center; gap: 6px; }
        .gps-box .gps-koord { flex: 1; font-variant-numeric: tabular-nums; }
        .gps-kopier { border: 1px solid var(--ink); background: #fff; padding: 2px 8px; font-size: 11px; font-weight: 500; cursor: pointer; border-radius: 0; transition: background .3s ease; }
        .gps-kopier:hover { background: var(--winter-bg); }

        .download-area { width: 100%; background: rgba(255,255,255,.95); border: 1px solid var(--ink); border-radius: 0; padding: 5px 8px; box-sizing: border-box; backdrop-filter: blur(4px); text-align: left; }
        .download-header { font-size: 11px; font-weight: 600; color: var(--ink); margin-bottom: 3px; display: flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; line-height: 1.2; }
        .download-area:not(.open) { min-height: 32px; display: flex; align-items: center; }
        .download-area:not(.open) .download-header { margin-bottom: 0; width: 100%; }
        .download-area:not(.open) .download-links-container { display: none; }
        .download-links-container { display: flex; flex-wrap: wrap; gap: 3px 10px; }
        .dl-link { font-size: 11px; font-weight: 500; color: var(--winter-ink); text-decoration: underline; cursor: pointer; }
        .dl-link:hover { color: var(--ink); }

        .control-row-container { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,.95); padding: 4px 8px; border-radius: 0; border: 1px solid var(--ink); width: 100%; box-sizing: border-box; backdrop-filter: blur(4px); gap: 6px; }
        .control-label { font-size: 11px; font-weight: 500; flex-grow: 1; text-align: left; position: relative; }
        .toggle-group { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
        .toggle-text { font-size: 9px; color: var(--muted); font-weight: 500; }
        .switch-track { width: 30px; height: 16px; background: var(--switch-grey); border-radius: 20px; position: relative; }
        .switch-thumb { width: 12px; height: 12px; background: white; border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: .3s; }
        .active .switch-track { background: var(--winter-ink); }
        .active .switch-thumb { transform: translateX(14px); }

        .badge-label { position: absolute; top: -6px; right: -6px; font-size: 8px; padding: 1px 4px; border-radius: 8px; z-index: 10; font-weight: bold; pointer-events: none; }
        .badge-year { background: #fff; color: var(--muted); border: 1px solid #b5b5b5; }
        .badge-2026 { background: #d1fae5; color: #065f46; border: 1px solid #065f46; }

        /* ===== Kontrollknapper ===== */
        .ctl { padding: 8px 14px; border: 1px solid var(--ink); border-radius: 0; background: #fff; color: var(--ink); font-size: 14px; font-weight: 400; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background .3s ease; }
        .ctl svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
        .ctl:hover { background: var(--winter-bg); }
        .ctl.ctl-summer:hover { background: var(--summer-bg); }
        .ctl.ctl-map:hover { background: var(--map-bg); }
        .skala-toggle { display: inline-flex; align-items: center; gap: 6px; margin-left: 4px; padding-left: 10px; border-left: 1px solid rgba(255,255,255,.5); cursor: pointer; }
        .skala-tekst { font-size: 12px; font-weight: 400; }
        .skala-toggle .switch-track { background: rgba(255,255,255,.35); }
        .skala-toggle.active .switch-track { background: #fff; }
        .skala-toggle.active .switch-thumb { background: var(--winter-ink); transform: translateX(14px); }
        .btn-toggle-active, .btn-toggle-active:hover { background-color: var(--winter-ink) !important; color: #fff !important; border-color: var(--winter-ink) !important; }

        /* Stedsknapper */
        .letter-btn { position: relative; background: #fff; color: var(--ink); border: 1px solid var(--ink); border-radius: 0; padding: 10px 14px; cursor: pointer; font-size: 14px; font-weight: 400; white-space: nowrap; transition: background .3s ease, color .3s ease; }
        @media (hover: hover) { .letter-btn:hover:not(.active) { background: var(--winter-bg); } }
        .letter-btn.active { background: var(--winter-ink); border-color: var(--winter-ink); color: #fff; }

        /* Søkefelt */
        .search-input-wrapper { position: relative; display: flex; align-items: center; }
        .search-input-wrapper span { position: absolute; left: 10px; display: flex; align-items: center; pointer-events: none; }
        .search-input-wrapper svg { width: 15px; height: 15px; fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-linecap: round; }
        #topSearchInput { width: 170px; padding: 8px 12px 8px 32px; border: 1px solid var(--ink); border-radius: 0; background: #fff; color: var(--ink); font-size: 14px; font-weight: 400; outline: none; transition: border-color .3s ease; font-family: inherit; }
        #topSearchInput:focus { border-color: var(--winter-ink); box-shadow: 0 0 0 1px var(--winter-ink); }

        /* Markører: kun fjellikonet */
        .klatre-pin { background: none; border: 0; box-shadow: none; display: flex; justify-content: center; align-items: center; }
        .klatre-pin svg { width: 22px; height: 22px; fill: none; stroke: #1d4560; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; overflow: visible; transform-origin: 50% 60%; filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 3px #fff) drop-shadow(0 0 5px rgba(255,255,255,.95)); transition: transform .2s ease, fill .25s ease, stroke .25s ease; }
        .klatre-pin:hover svg, .klatre-pin.inverted svg { transform: scale(1.25); }
        .klatre-pin.inverted svg { fill: #1d4560; stroke: var(--ink); }
        .leaflet-tooltip.sted-tip { background: #fff; color: var(--ink); border: 1px solid var(--ink); border-radius: 0; box-shadow: none; font-family: "Jost", Arial, sans-serif; font-size: 12px; font-weight: 500; padding: 2px 8px; }
        .leaflet-tooltip.sted-tip.leaflet-tooltip-top:before { border-top-color: var(--ink); }

        /* Popup */
        .leaflet-popup-content-wrapper { background: #fff; color: var(--ink); border: 1px solid var(--ink); border-radius: 0; box-shadow: 0 10px 30px rgba(0,0,0,.14); font-family: "Jost", "Helvetica Neue", Arial, sans-serif; }
        .leaflet-popup-content { margin: 14px 16px 12px; font-size: 13px; font-weight: 400; line-height: 1.4; text-align: left; }
        .leaflet-popup-tip { background: #fff; border: 1px solid var(--ink); box-shadow: none; }
        .leaflet-container a.leaflet-popup-close-button { color: var(--ink); font: 300 22px/26px "Jost", Arial, sans-serif; top: 4px; right: 4px; width: 26px; height: 26px; }
        .leaflet-container a.leaflet-popup-close-button:hover { color: var(--winter-ink); background: none; }
        .prof-title { font-size: 18px; font-weight: 300; letter-spacing: -.01em; line-height: 1.2; padding-right: 18px; }
        .prof-date { font-size: 12px; color: var(--muted); margin-top: 2px; }

        /* Bratthet-tegnforklaring */
        .legend { background: rgba(255,255,255,.92); padding: 10px 12px; line-height: 1.5; color: #333; border: 1px solid var(--ink); border-radius: 0; font-size: 12px; backdrop-filter: blur(4px); text-align: left; }
        .legend h4 { margin: 0 0 6px 0; font-size: 13px; font-weight: 600; color: var(--dark-grey); }
        .legend-item { display: flex; align-items: center; margin-bottom: 3px; font-weight: 500; }
        .color-box { width: 16px; height: 16px; margin-right: 8px; border: 1px solid rgba(0,0,0,.2); }

        /* Buy me a coffee */
        .custom-bmc-btn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; cursor: pointer; box-sizing: border-box; background: #fff; color: var(--ink); border: 1px solid var(--ink); border-radius: 0; font-weight: 400; font-size: 12px; padding: 5px 10px; margin-left: auto; opacity: .85; transition: background .3s ease, opacity .2s; }
        .custom-bmc-btn:hover { background: #fff3b0; opacity: 1; }
        .custom-bmc-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }

        /* Popup (video / veibeskrivelse) */
        .modal { position: fixed; inset: 0; z-index: 100000; display: flex; align-items: center; justify-content: center; padding: 14px; box-sizing: border-box; background: rgba(0,0,0,.45); }
        .modal-boks { background: #fff; border: 1px solid var(--ink); width: min(100%, 480px); max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,.25); text-align: left; }
        .modal-boks.bred { width: min(100%, 860px); }
        .modal-hode { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; border-bottom: 1px solid var(--ink); }
        .modal-tittel { flex: 1; font-size: 16px; font-weight: 300; letter-spacing: -.01em; line-height: 1.2; }
        .modal-lenke { font-size: 12px; font-weight: 500; color: var(--winter-ink); text-decoration: underline; white-space: nowrap; }
        .modal-lenke:hover { color: var(--ink); }
        .modal-lukk { border: 0; background: none; padding: 0 4px; font-size: 26px; font-weight: 200; line-height: 1; color: var(--ink); cursor: pointer; transition: color .3s ease; }
        .modal-lukk:hover { color: var(--winter-ink); }
        .modal-verktoy { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 12px; border-bottom: 1px solid #e4e4e4; }
        .modal-verktoy input { flex: 1 1 200px; min-width: 0; padding: 7px 10px; border: 1px solid var(--ink); border-radius: 0; font-size: 14px; font-family: inherit; font-weight: 400; outline: none; }
        .modal-verktoy input:focus { border-color: var(--winter-ink); box-shadow: 0 0 0 1px var(--winter-ink); }
        .modal-knapp { padding: 7px 12px; border: 1px solid var(--ink); border-radius: 0; background: #fff; color: var(--ink); font-size: 13px; font-weight: 400; font-family: inherit; cursor: pointer; transition: background .3s ease; }
        .modal-knapp:hover { background: var(--winter-bg); }
        .modal-innhold { overflow: auto; -webkit-overflow-scrolling: touch; }
        .modal-innhold iframe { display: block; width: 100%; border: 0; background: #fff; }
        .modal-innhold iframe.rute { height: min(68vh, 620px); }
        .modal-merk { margin: 0; padding: 8px 14px 10px; font-size: 11px; line-height: 1.35; color: var(--muted); font-weight: 400; }

        /* Lasteindikator */
        #track-progress { position: absolute; top: 0; left: 0; right: 0; z-index: 1100; pointer-events: none; transition: opacity .5s ease; }
        #track-progress.done { opacity: 0; }
        #track-progress .tp-line { height: 2px; background: rgba(0,0,0,.12); overflow: hidden; }
        #track-progress .tp-fill { height: 100%; width: 30%; background: var(--winter-ink); animation: tp-slide 1.1s ease-in-out infinite; }
        #track-progress .tp-label { display: inline-block; padding: 3px 8px; background: rgba(255,255,255,.92); color: var(--muted); font-size: 12px; font-weight: 400; letter-spacing: .02em; }
        @keyframes tp-slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }

        /* Marker område for å zoome (pc) */
        .ctl-marker { display: none; }
        @media (hover: hover) and (pointer: fine) { .ctl-marker { display: inline-flex; } }
        #markerBtn.active, #markerBtn.active:hover { background: var(--ink); color: #fff; }
        #map-container.marker-modus, #map-container.marker-modus * { cursor: crosshair !important; }
        .marker-boks { position: absolute; z-index: 800; border: 1px solid var(--ink); background: rgba(0,0,0,.07); pointer-events: none; }
        .marker-hint { position: absolute; z-index: 801; left: 10px; top: 10px; background: #fff; border: 1px solid var(--ink); padding: 4px 10px; font-size: 12px; font-weight: 400; color: var(--ink); pointer-events: none; }

        @media (max-width: 768px) {
            #buttons { padding: 10px 2px; }
            #video-buttons-container { width: min(270px, calc(100% - 20px)); gap: 5px; }
            #map { height: 100vw; min-height: unset; width: 100%; }
            .custom-bmc-btn { margin-left: 0; }
        }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } #track-progress .tp-fill { animation: none; width: 100%; opacity: .4; } }
    </style>
</head>
<body>

    <h1><svg class="h-ico" viewBox="0 0 44 44" aria-hidden="true"><path d="M3 38L16 13l7 12 5-7 13 20z"/><path d="M12 19l4-6 3 5M26 22l2-4 3 5"/></svg>Top Rope Solo - Tromsø</h1>

    <div class="buttons-wrapper" id="buttonsWrapper">
        <div id="buttons"></div>
    </div>

    <div id="controls-row">
        <select id="mapSelect" class="ctl">
            <option value="norge">Norgeskart</option>
            <option value="osm">OpenStreetMap</option>

    <div id="modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTittel">
        <div class="modal-boks" id="modalBoks">
            <div class="modal-hode">
                <span id="modalTittel" class="modal-tittel"></span>
                <a id="modalEkstern" class="modal-lenke" target="_blank" rel="noopener">Åpne i ny fane</a>
                <button id="modalLukk" type="button" class="modal-lukk" aria-label="Lukk">×</button>
            </div>
            <div id="modalVerktoy" class="modal-verktoy" hidden>
                <input type="text" id="modalStart" aria-label="Startadresse" placeholder="Startadresse" autocomplete="off" />
                <button type="button" id="modalVis" class="modal-knapp">Vis rute</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>

    <script>
    /* Lenketype for video-listen */
    function lenkeType(v) {
        const u = String((v && v.url) || ''), t = String((v && v.type) || '').toLowerCase();
        if (t === 'strava' || /strava\.(com|app\.link)/i.test(u)) return 'strava';
        if (t === 'suunto' || /suunto/i.test(u)) return 'suunto';
        if (t === 'photo') return 'photo';
        return 'video';
    }
    </script>

    <script>
        /* Google Maps Embed API-nøkkel (gratis). Limes inn mellom anførselstegnene for å få veibeskrivelse i popup.
           Uten nøkkel åpnes Google Maps i ny fane. Begrens nøkkelen til nettadressen din i Google Cloud. */
        const GOOGLE_MAPS_API_KEY = '';

        const map = L.map('map', { zoomSnap: 0.5 }).setView([69.69, 18.75], 11);

        // Oversiktsvisning: «vis alle» zoomet litt inn. Endre tallet for mer/mindre zoom.
        const OVERSIKT_ZOOM_INN = 0;
        function visOversikt() {
            if (!markerGroup.getLayers().length) return;
            const padding = 60;
            map.invalidateSize({ animate: false });
            const b = markerGroup.getBounds();
            const fullZoom = map.getBoundsZoom(b, false, L.point(padding * 2, padding * 2));
            map.setView(b.getCenter(), Math.min(fullZoom + OVERSIKT_ZOOM_INN, map.getMaxZoom()));
        }

        const markerGroup = L.featureGroup().addTo(map);
        const videoContainer = document.getElementById('video-buttons-container');
        let aktiveEkstraLag = [];
        let aktivtStedNavn = null;
        let isReseting = false;
        let aktiveringsTeller = 0;
        const SPOR_FARGER = ['#2c3e50', '#c2410c'];

        let steder = [];
        const knapperMap = {};   // id -> { items, aktiver }
        const markorMap = {};    // id -> L.marker
        const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || window.matchMedia("(pointer: coarse)").matches;

        const buttonsContainer = document.getElementById('buttons');
        const buttonsWrapper = document.getElementById('buttonsWrapper');
        buttonsContainer.addEventListener('scroll', () => {
            const maxScroll = buttonsContainer.scrollWidth - buttonsContainer.clientWidth;
            buttonsWrapper.classList.toggle('scrolled-end', buttonsContainer.scrollLeft >= maxScroll - 5);
            lukkAlleDropdowns();
        });

        /* ---------- Kartlag ---------- */
        const norgeLayer = L.tileLayer('https://cache.kartverket.no/v1/wmts/1.0.0/topo/default/webmercator/{z}/{y}/{x}.png', { attribution: '© Kartverket' });
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' });

        const bratthetMap = L.tileLayer('https://gis3.nve.no/arcgis/rest/services/wmts/Bratthet_2024/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18, opacity: 0.6, attribution: '© NVE'
        });

        const legend = L.control({ position: 'bottomleft' });
        legend.onAdd = function () {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = `
                <h4>Hellingsvinkel</h4>
                <div class="legend-item"><span class="color-box" style="background:#FFF500;"></span> 27° – 30°</div>
                <div class="legend-item"><span class="color-box" style="background:#FFAA00;"></span> 30° – 35°</div>
                <div class="legend-item"><span class="color-box" style="background:#E60000;"></span> 35° – 40°</div>
                <div class="legend-item"><span class="color-box" style="background:#730000;"></span> 40° – 45°</div>
                <div class="legend-item"><span class="color-box" style="background:#000000;"></span> Over 45°</div>
            `;
            return div;
        };

        const bratthetBtn = document.getElementById('bratthetBtn');
        const skalaToggle = document.getElementById('skalaToggle');
        let isBratthetActive = false;
        function toggleBratthet(state) {
            isBratthetActive = (typeof state === 'boolean') ? state : !isBratthetActive;
            if (isBratthetActive) { map.addLayer(bratthetMap); bratthetBtn.classList.add('btn-toggle-active'); }
            else { map.removeLayer(bratthetMap); bratthetBtn.classList.remove('btn-toggle-active'); toggleLegend(false); }
            skalaToggle.hidden = !isBratthetActive;   // bryteren vises bare når bratthet er på
        }
        bratthetBtn.onclick = () => toggleBratthet();
        skalaToggle.onclick = e => { e.stopPropagation(); toggleLegend(); };

        let isLegendActive = false;
        function toggleLegend(state) {
            const ny = (typeof state === 'boolean') ? state : !isLegendActive;
            if (ny === isLegendActive) return;
            isLegendActive = ny;
            if (isLegendActive) legend.addTo(map); else map.removeControl(legend);
            skalaToggle.classList.toggle('active', isLegendActive);
            skalaToggle.setAttribute('aria-checked', String(isLegendActive));
        }

        /* ---------- Oversiktskart (grått land, hvitt hav, blå innsjøer) ---------- */
        const LINJE = '#000000';
        const veiFilter = ['match', ['get', 'class'], ['motorway', 'trunk', 'primary', 'secondary', 'tertiary', 'minor'], true, false];
        const veiBredde = ['interpolate', ['exponential', 1.4], ['zoom'], 6, 0.4, 10, 0.8, 14, 1.6, 18, 4];
        const glStil = {
            version: 8,
            glyphs: 'https://tiles.openfreemap.org/fonts/{fontstack}/{range}.pbf',
            sources: { omt: { type: 'vector', url: 'https://tiles.openfreemap.org/planet' } },
            layers: [
                { id: 'land', type: 'background', paint: { 'background-color': '#000000', 'background-opacity': 0.07 } },
                { id: 'hav-flate', type: 'fill', source: 'omt', 'source-layer': 'water',
                  filter: ['==', ['get', 'class'], 'ocean'], paint: { 'fill-color': '#ffffff', 'fill-opacity': 1 } },
                { id: 'innsjo-flate', type: 'fill', source: 'omt', 'source-layer': 'water',
                  filter: ['!=', ['get', 'class'], 'ocean'], paint: { 'fill-color': '#7fb2dc', 'fill-opacity': 0.4 } },
                { id: 'vann-linje', type: 'line', source: 'omt', 'source-layer': 'water',
                  layout: { 'line-join': 'round' },
                  paint: { 'line-color': LINJE, 'line-width': ['interpolate', ['linear'], ['zoom'], 4, 0.5, 10, 0.9, 14, 1.2] } },
                { id: 'veier', type: 'line', source: 'omt', 'source-layer': 'transportation',
                  filter: ['all', veiFilter, ['!=', ['get', 'brunnel'], 'tunnel']],
                  layout: { 'line-cap': 'round', 'line-join': 'round' },
                  paint: { 'line-color': LINJE, 'line-width': veiBredde } },
                { id: 'veier-tunnel', type: 'line', source: 'omt', 'source-layer': 'transportation',
                  filter: ['all', veiFilter, ['==', ['get', 'brunnel'], 'tunnel']],
                  layout: { 'line-join': 'round' },
                  paint: { 'line-color': LINJE, 'line-width': veiBredde, 'line-dasharray': [2, 2] } },
                { id: 'veier-service', type: 'line', source: 'omt', 'source-layer': 'transportation', minzoom: 13,
                  filter: ['==', ['get', 'class'], 'service'],
                  layout: { 'line-cap': 'round', 'line-join': 'round' },
                  paint: { 'line-color': LINJE, 'line-width': ['interpolate', ['linear'], ['zoom'], 13, 0.4, 18, 1.5] } },
                { id: 'steder', type: 'symbol', source: 'omt', 'source-layer': 'place',
                  filter: ['match', ['get', 'class'], ['city', 'town', 'village'], true, false],
                  layout: { 'text-field': ['coalesce', ['get', 'name:nb'], ['get', 'name']], 'text-font': ['Noto Sans Regular'],
                            'text-size': ['match', ['get', 'class'], 'city', 15, 'town', 13, 11], 'text-max-width': 8 },
                  paint: { 'text-color': LINJE, 'text-halo-color': '#ffffff', 'text-halo-width': 1.5 } }
            ]
        };

        map.createPane('linjePane');
        map.getPane('linjePane').style.zIndex = 250;
        map.getPane('linjePane').style.pointerEvents = 'none';
        map.createPane('libertyPane');
        map.getPane('libertyPane').style.zIndex = 190;   // under bratthet-laget, så bratthet alltid ligger oppå
        map.getPane('libertyPane').style.pointerEvents = 'none';

        let oversiktGlLayer;
        try {
            if (typeof L.maplibreGL !== 'function' || typeof maplibregl === 'undefined') throw new Error('MapLibre er ikke lastet');
            oversiktGlLayer = L.maplibreGL({
                style: glStil, pane: 'linjePane',
                attribution: '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> Data fra <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
            });
        } catch (err) {
            console.warn('Vektorkart feilet, bruker Kartverket gråtone i stedet', err);
            oversiktGlLayer = L.tileLayer('https://cache.kartverket.no/v1/wmts/1.0.0/topograatone/default/webmercator/{z}/{y}/{x}.png', {
                attribution: '© <a href="https://www.kartverket.no/">Kartverket</a>', maxZoom: 20, maxNativeZoom: 18
            });
        }

        const topoMap = L.tileLayer('https://cache.kartverket.no/v1/wmts/1.0.0/topograatone/default/webmercator/{z}/{y}/{x}.png', {
            maxZoom: 20, maxNativeZoom: 18, zIndex: 1, attribution: '© <a href="https://www.kartverket.no/">Kartverket</a>'
        });
        const topoBtn = document.getElementById('topoBtn');
        const mapSelectEl = document.getElementById('mapSelect');
        let topoAktiv = false;
        topoBtn.onclick = () => {
            topoAktiv = !topoAktiv;
            if (topoAktiv) map.addLayer(topoMap); else map.removeLayer(topoMap);
            topoBtn.classList.toggle('btn-toggle-active', topoAktiv);
        };

        // Bytter mellom oversiktskart (ingen sted valgt) og detaljkart (sted valgt)
        /* Liberty topo (OpenFreeMap). Lages først når det velges. Bytt stil-adressen under om du vil ha en annen Liberty-variant. */
        const LIBERTY_STIL = 'https://tiles.openfreemap.org/styles/liberty';
        let libertyLayer = null;
        function hentLiberty() {
            if (libertyLayer) return libertyLayer;
            try {
                if (typeof L.maplibreGL !== 'function' || typeof maplibregl === 'undefined') throw new Error('MapLibre er ikke lastet');
                libertyLayer = L.maplibreGL({
                    style: LIBERTY_STIL, pane: 'libertyPane',
                    attribution: '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://openmaptiles.org/" target="_blank" rel="noopener">OpenMapTiles</a> Data fra <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
                });
            } catch (err) {
                console.warn('Liberty feilet, bruker OpenStreetMap i stedet', err);
                libertyLayer = osmLayer;
            }
            return libertyLayer;
        }
        function fjernGrunnkart() {
            [norgeLayer, osmLayer, libertyLayer].forEach(l => { if (l && map.hasLayer(l)) map.removeLayer(l); });
        }
        function settGrunnkart() {
            fjernGrunnkart();
            const v = mapSelectEl.value;
            map.addLayer(v === 'osm' ? osmLayer : v === 'liberty' ? hentLiberty() : norgeLayer);
            if (map.hasLayer(bratthetMap)) bratthetMap.bringToFront();
        }

        let kartModus = null;
        function settKartModus(modus) {
            if (modus === kartModus) return;
            kartModus = modus;
            if (modus === 'oversikt') {
                fjernGrunnkart();
                map.addLayer(oversiktGlLayer);
                if (topoAktiv) map.addLayer(topoMap);
                topoBtn.style.display = '';
                mapSelectEl.style.display = 'none';
            } else {
                map.removeLayer(oversiktGlLayer);
                map.removeLayer(topoMap);
                settGrunnkart();
                topoBtn.style.display = 'none';
                mapSelectEl.style.display = '';
            }
            if (map.hasLayer(bratthetMap)) bratthetMap.bringToFront();
        }
        settKartModus('oversikt');

        mapSelectEl.onchange = () => {
            if (kartModus !== 'topp') return;
            settGrunnkart();
        };

        /* ---------- Hjelpere ---------- */
        function lagBadge(fil, override) {
            if (!fil && !override) return null;
            const s = document.createElement('span');
            const aar = override || String(fil).split('_')[0];
            s.className = 'badge-label ' + (aar === '2026' ? 'badge-2026' : 'badge-year');
            s.innerText = aar;
            return s;
        }
        function lastNedGPX(filsti, filnavn) {
            const link = document.createElement('a');
            link.href = filsti;
            link.download = filnavn.endsWith('.gpx') ? filnavn : filnavn + '.gpx';
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }
        function skapKontrollRad(label, startOn, onSporToggle, farge) {
            const container = document.createElement('div');
            container.className = 'control-row-container';
            const labelEl = document.createElement('div');
            labelEl.className = 'control-label';
            labelEl.innerText = label;
            if (farge) {
                const strek = document.createElement('span');
                strek.style.cssText = 'display:inline-block;width:14px;height:0;border-top:3px dashed ' + farge + ';margin-right:6px;vertical-align:middle';
                labelEl.insertBefore(strek, labelEl.firstChild);
            }
            container.appendChild(labelEl);
            const sporGroup = document.createElement('div');
            sporGroup.className = 'toggle-group' + (startOn ? ' active' : '');
            sporGroup.innerHTML = `<span class="toggle-text">Vis</span><div class="switch-track"><div class="switch-thumb"></div></div>`;
            sporGroup.onclick = () => { onSporToggle(sporGroup.classList.toggle('active')); };
            container.appendChild(sporGroup);
            return container;
        }
        /* ---------- Popup ---------- */
        const modalEl = document.getElementById('modal'), modalBoks = document.getElementById('modalBoks');
        const modalInnhold = document.getElementById('modalInnhold'), modalVerktoy = document.getElementById('modalVerktoy');
        const modalEkstern = document.getElementById('modalEkstern'), modalStart = document.getElementById('modalStart');
        let modalFokusTilbake = null, modalVis = null;

        function aapneModal(o) {
            modalFokusTilbake = document.activeElement;
            document.getElementById('modalTittel').textContent = o.tittel || '';
            modalEkstern.href = o.ekstern || '#';
            modalBoks.classList.toggle('bred', !!o.bred);
            modalVerktoy.hidden = !o.verktoy;
            modalInnhold.innerHTML = '';
            if (o.node) { modalInnhold.appendChild(o.node); }
            else {
                const f = document.createElement('iframe');
                f.className = o.klasse || '';
                f.setAttribute('allowfullscreen', '');
                f.setAttribute('allow', 'autoplay; encrypted-media; fullscreen; geolocation');
                f.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
                f.title = o.tittel || '';
                f.src = o.src;
                modalInnhold.appendChild(f);
            }
            if (o.merk) { const p = document.createElement('p'); p.className = 'modal-merk'; p.textContent = o.merk; modalInnhold.appendChild(p); }
            modalEl.hidden = false;
            document.getElementById('modalLukk').focus();
        }
        function lukkModal() {
            if (modalEl.hidden) return;
            modalEl.hidden = true;
            modalInnhold.innerHTML = '';     // stopper videoen
            modalVis = null;
            if (modalFokusTilbake && modalFokusTilbake.focus) modalFokusTilbake.focus();
        }
        document.getElementById('modalLukk').onclick = lukkModal;
        modalEl.addEventListener('mousedown', e => { if (e.target === modalEl) lukkModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modalEl.hidden) lukkModal(); });
        // Vanlig klikk åpner popup; Ctrl/Cmd/midtklikk åpner som vanlig lenke i ny fane
        const vanligKlikk = e => !(e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1);

        function instagramPermalink(url) {
            const m = /instagram\.com\/(p|reel|reels|tv)\/([\w-]+)/i.exec(String(url || ''));
            return m ? 'https://www.instagram.com/' + (m[1].toLowerCase() === 'reels' ? 'reel' : m[1].toLowerCase()) + '/' + m[2] + '/' : null;
        }
        function behandleInstaEmbed() {
            if (window.instgrm && window.instgrm.Embeds) { window.instgrm.Embeds.process(); return; }
            if (!document.getElementById('insta-embed-js')) {
                const sc = document.createElement('script');
                sc.id = 'insta-embed-js'; sc.async = true; sc.src = 'https://www.instagram.com/embed.js';
                sc.onload = () => { if (window.instgrm && window.instgrm.Embeds) window.instgrm.Embeds.process(); };
                document.body.appendChild(sc);
            }
        }
        /* Målpunkt for veibeskrivelsen: eget punkt i JSON (veibeskrivelse_gps), ellers start på spor 1, ellers selve klatrestedet */
        function veiMaal(sted) {
            const o = sted.veibeskrivelse_gps;
            if (o && typeof o.lat === 'number' && typeof o.lng === 'number') return o;
            return sted._parkering || sted.gps;
        }
        function veiMaalStr(sted) { const g = veiMaal(sted); return g.lat + ',' + g.lng; }
        function ruteUrl(sted, start) {
            return 'https://www.google.com/maps/embed/v1/directions?key=' + encodeURIComponent(GOOGLE_MAPS_API_KEY) +
                '&origin=' + encodeURIComponent(start) + '&destination=' + veiMaalStr(sted) +
                '&mode=driving&language=' + (window.__lang && window.__lang() === 'en' ? 'en' : 'no');
        }
        function aapneRute(sted) {
            const lagre = () => { try { return localStorage.getItem('toprope_start') || ''; } catch (_) { return ''; } };
            modalStart.value = lagre() || 'Tromsø sentrum';
            const vis = () => {
                const start = modalStart.value.trim() || 'Tromsø sentrum';
                try { localStorage.setItem('toprope_start', start); } catch (_) {}
                modalEkstern.href = 'https://www.google.com/maps/dir/?api=1&origin=' + encodeURIComponent(start) + '&destination=' + veiMaalStr(sted) + '&travelmode=driving';
                const f = modalInnhold.querySelector('iframe');
                if (f) f.src = ruteUrl(sted, start);
            };
            aapneModal({ tittel: 'Veibeskrivelse til ' + sted.navn, ekstern: '#', src: ruteUrl(sted, modalStart.value), klasse: 'rute', bred: true, verktoy: true });
            modalVis = vis; vis();
        }
        document.getElementById('modalVis').onclick = () => { if (modalVis) modalVis(); };
        modalStart.addEventListener('keydown', e => { if (e.key === 'Enter' && modalVis) modalVis(); });
        document.getElementById('modalPos').onclick = () => {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(
                p => { modalStart.value = p.coords.latitude.toFixed(5) + ',' + p.coords.longitude.toFixed(5); if (modalVis) modalVis(); },
                () => { modalStart.focus(); }, { timeout: 8000 });
        };

        /* Instagram-forhåndsvisningen (som i popupen) som bakgrunn i selve ruten.
           Vises bare når Instagram faktisk svarer; ellers beholdes ruten som vanlig. */
        function lagEmbedForhandsvisning(tile, permalink) {
            const boks = document.createElement('div');
            boks.className = 'vt-embed';
            const bq = document.createElement('blockquote');
            bq.className = 'instagram-media';
            bq.setAttribute('data-instgrm-permalink', permalink + '?utm_source=ig_embed&utm_campaign=loading');
            bq.setAttribute('data-instgrm-version', '14');
            boks.appendChild(bq);
            tile.insertBefore(boks, tile.firstChild);
            const juster = () => { if (tile.clientWidth) tile.style.setProperty('--s', (tile.clientWidth / 326).toFixed(4)); };
            const obs = new MutationObserver(() => {
                if (!boks.querySelector('iframe')) return;
                obs.disconnect();
                tile.classList.add('har-bilde', 'har-embed');
                juster();
                if (window.ResizeObserver) new ResizeObserver(juster).observe(tile);
            });
            obs.observe(boks, { childList: true, subtree: true });
        }

        const VIDEO_IKON = {
            video: '<svg class="vt-ikon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13"/><path d="M13 10.5v11l9-5.5z"/></svg>',
            photo: '<svg class="vt-ikon" viewBox="0 0 32 32" aria-hidden="true"><rect x="3.5" y="8" width="25" height="18" rx="1"/><path d="M11 8l1.8-3h6.4L21 8"/><circle cx="16" cy="17" r="5"/></svg>',
            strava: '<svg class="vt-ikon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13"/><path d="M8 21l5-8 3 4 3-6 5 10"/></svg>',
            suunto: '<svg class="vt-ikon" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13"/><path d="M16 8l8 14H8z"/></svg>'
        };
        const fmtKoord = g => g.lat.toFixed(5) + ', ' + g.lng.toFixed(5);

        const lagKlatreIkon = (ekstra = '') => L.divIcon({
            html: `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 20l7-12 4 7 3-4 6 9z"/></svg>`,
            className: 'klatre-pin ' + ekstra,
            iconSize: [34, 34], iconAnchor: [17, 17], popupAnchor: [0, -17]
        });

        /* ---------- Hover over stedsknappene ---------- */
        let hoverId = null, hoverStartView = null, hoverBackTimer = null;
        function startHover(sted) {
            if (isTouchDevice || aktivtStedNavn || isReseting) return;
            const m = markorMap[sted.id];
            if (!m) return;
            clearTimeout(hoverBackTimer);
            if (hoverId && hoverId !== sted.id && markorMap[hoverId]) markorMap[hoverId].setIcon(lagKlatreIkon());
            if (!hoverStartView) hoverStartView = { center: map.getCenter(), zoom: map.getZoom() };
            hoverId = sted.id;
            m.setIcon(lagKlatreIkon('inverted'));
            map.flyTo([sted.gps.lat, sted.gps.lng], 13, { duration: 0.4 });
        }
        function planleggSluttHover() { clearTimeout(hoverBackTimer); hoverBackTimer = setTimeout(avsluttHover, 150); }
        function avsluttHover() {
            clearTimeout(hoverBackTimer);
            if (!hoverId && !hoverStartView) return;
            if (!aktivtStedNavn && !isReseting) {
                if (hoverId && markorMap[hoverId]) markorMap[hoverId].setIcon(lagKlatreIkon());
                if (hoverStartView) map.flyTo(hoverStartView.center, hoverStartView.zoom, { duration: 0.4 });
            }
            hoverId = null; hoverStartView = null;
        }
        function avbrytHover() { clearTimeout(hoverBackTimer); hoverId = null; hoverStartView = null; }

        /* ---------- Én knapp per klatresteds ---------- */
        function lukkAlleDropdowns() { avsluttHover(); }
        document.addEventListener('click', lukkAlleDropdowns);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lukkAlleDropdowns(); });

        function byggStedKnapper() {
            steder.forEach(sted => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'letter-btn';
                btn.textContent = sted.navn;
                knapperMap[sted.id] = { items: [btn], aktiver: null };
                btn.onclick = (e) => {
                    e.stopPropagation();
                    avbrytHover();
                    if (knapperMap[sted.id].aktiver) knapperMap[sted.id].aktiver();
                };
                if (!isTouchDevice) {
                    btn.onmouseenter = () => startHover(sted);
                    btn.onmouseleave = () => planleggSluttHover();
                }
                buttonsContainer.appendChild(btn);
            });
        }

        /* ---------- Rydd opp i kartet ---------- */
        function fjernEkstraLag() {
            aktiveEkstraLag.forEach(l => map.removeLayer(l));
            aktiveEkstraLag = [];
        }

        /* ---------- GPX-spor ---------- */
        // Støtter tilkomst.spor = [{gpx, tittel, farge}, ...] (anbefalt), og de gamle feltene tilkomst.gpx / tilkomst.punkter
        function hentSporListe(t) {
            if (Array.isArray(t.spor)) return t.spor.filter(sp => sp && (sp.gpx || (Array.isArray(sp.punkter) && sp.punkter.length > 1)));
            if (t.gpx) return [{ gpx: t.gpx, farge: t.farge }];
            if (Array.isArray(t.punkter) && t.punkter.length > 1) return [{ punkter: t.punkter, farge: t.farge }];
            return [];
        }
        const gpxCache = {};
        function parseGpx(tekst) {
            const xml = new DOMParser().parseFromString(tekst, 'application/xml');
            if (xml.getElementsByTagName('parsererror').length) throw new Error('Ugyldig GPX');
            const hent = nodes => Array.from(nodes).map(n => [parseFloat(n.getAttribute('lat')), parseFloat(n.getAttribute('lon'))]).filter(p => isFinite(p[0]) && isFinite(p[1]));
            const segs = [];
            Array.from(xml.getElementsByTagName('trkseg')).forEach(seg => { const p = hent(seg.getElementsByTagName('trkpt')); if (p.length > 1) segs.push(p); });
            if (!segs.length) { const p = hent(xml.getElementsByTagName('rtept')); if (p.length > 1) segs.push(p); }
            if (!segs.length) throw new Error('Fant ingen punkter i GPX');
            return segs;
        }
        function hentSporSegmenter(sp) {
            if (!sp.gpx) return Promise.resolve([sp.punkter]);
            if (!gpxCache[sp.gpx]) {
                gpxCache[sp.gpx] = fetch('gpx/' + sp.gpx).then(r => { if (!r.ok) throw new Error('Fant ikke gpx/' + sp.gpx); return r.text(); }).then(parseGpx);
                gpxCache[sp.gpx].catch(() => { delete gpxCache[sp.gpx]; });
            }
            return gpxCache[sp.gpx];
        }
        function byggSporLag(segs, farge, tittel) {
            const lag = L.featureGroup(segs.map(seg => L.polyline(seg, { color: farge, weight: 3, opacity: 0.95, dashArray: '4,6' })));
            const start = L.circleMarker(segs[0][0], { radius: 5, color: farge, weight: 2, fillColor: '#fff', fillOpacity: 1 });
            start.bindTooltip('Start', { direction: 'top', className: 'sted-tip' });
            lag.addLayer(start);
            return lag;
        }

        /* ---------- Aktiver et sted ---------- */
        function lagAktiver(sted) {
            return function aktiver() {
                isReseting = false; aktivtStedNavn = sted.navn; settKartModus('topp');
                const token = ++aktiveringsTeller;
                document.getElementById('topSearchInput').value = sted.navn;
                avbrytHover(); lukkAlleDropdowns();
                map.closePopup();

                const newUrl = window.location.protocol + '//' + window.location.host + window.location.pathname + '?sted=' + encodeURIComponent(sted.id);
                window.history.pushState({ path: newUrl }, '', newUrl);

                document.querySelectorAll('.letter-btn').forEach(el => el.classList.remove('active'));
                knapperMap[sted.id].items.forEach(el => el.classList.add('active'));
                fjernEkstraLag();
                Object.keys(markorMap).forEach(id => markorMap[id].setIcon(lagKlatreIkon(id === sted.id ? 'inverted' : '')));

                videoContainer.innerHTML = '';
                videoContainer.classList.remove('ui-hidden');

                /* Topprad: Del + Skjul meny */
                const menuTopRow = document.createElement('div');
                menuTopRow.className = 'menu-top-row';
                const shareBtn = document.createElement('button');
                shareBtn.className = 'share-ui-btn';
                shareBtn.innerHTML = '<span>🔗</span> Del';
                shareBtn.onclick = () => {
                    navigator.clipboard.writeText(window.location.href).then(() => {
                        shareBtn.innerHTML = '<span>✓</span> Kopiert!';
                        setTimeout(() => { shareBtn.innerHTML = '<span>🔗</span> Del'; }, 2000);
                    }).catch(err => console.error('Kunne ikke kopiere lenke:', err));
                };
                const hideBtn = document.createElement('button');
                hideBtn.className = 'toggle-ui-btn';
                hideBtn.innerText = 'Skjul meny';
                hideBtn.onclick = () => { hideBtn.innerText = videoContainer.classList.toggle('ui-hidden') ? 'Vis meny' : 'Skjul meny'; };
                menuTopRow.appendChild(shareBtn);
                menuTopRow.appendChild(hideBtn);
                videoContainer.appendChild(menuTopRow);

                /* Videoer: 1–6 ruter med ikon */
                const vlist = sted.videoer || [];
                if (vlist.length) {
                    const grid = document.createElement('div');
                    grid.className = 'video-grid';
                    vlist.forEach(v => {
                        const lt = lenkeType(v);
                        const a = document.createElement('a');
                        a.className = 'video-tile'; a.href = v.url; a.target = '_blank'; a.rel = 'noopener';
                        a.title = v.tittel || '';
                        a.innerHTML = VIDEO_IKON[lt] + '<span class="vt-navn"></span>';
                        a.querySelector('.vt-navn').textContent = v.tittel || 'Video';
                        const vBadge = lagBadge(v.dato || null);
                        if (vBadge) a.appendChild(vBadge);
                        if (v.plakat) {
                            const img = new Image();
                            img.onload = () => { a.style.backgroundImage = 'url("' + String(v.plakat).replace(/"/g, '%22') + '")'; a.classList.add('har-bilde'); };
                            img.src = v.plakat;
                        } else {
                            const perm = instagramPermalink(v.url);
                            if (perm) lagEmbedForhandsvisning(a, perm);
                        }
                        grid.appendChild(a);
                    });
                    videoContainer.appendChild(grid);
                    if (grid.querySelector('.vt-embed')) behandleInstaEmbed();
                }

                /* Klatrefører Tromsø */
                if (sted.klatreforer) {
                    const kf = document.createElement('a');
                    kf.className = 'search-link-btn'; kf.href = sted.klatreforer; kf.target = '_blank'; kf.rel = 'noopener';
                    kf.innerHTML = '<span>🧗</span> Klatrefører Tromsø';
                    videoContainer.appendChild(kf);
                }

                /* Veibeskrivelse (Google Maps) */
                const mapsBtn = document.createElement('a');
                mapsBtn.className = 'search-link-btn';
                const settVeiLenke = () => { mapsBtn.href = `https://www.google.com/maps/dir/?api=1&destination=${veiMaalStr(sted)}&travelmode=driving`; };
                settVeiLenke();
                mapsBtn.target = '_blank'; mapsBtn.rel = 'noopener';
                mapsBtn.innerHTML = '<span>🚘</span> Veibeskrivelse';
                mapsBtn.addEventListener('click', e => { if (GOOGLE_MAPS_API_KEY && vanligKlikk(e)) { e.preventDefault(); aapneRute(sted); } });
                videoContainer.appendChild(mapsBtn);

                /* Tekst om veien dit */
                const descBox = document.createElement('div');
                descBox.className = 'desc-box';
                const vbTekst = sted.veibeskrivelse ? sted.veibeskrivelse : '<span class="tom">Kommer mer info snart...</span>';
                descBox.innerHTML = `<div class="desc-box-title"><span>📝</span> Info om klatrestedet<span class="chev">▼</span></div><div class="desc-box-body">${vbTekst}</div>`;
                descBox.classList.add('collapsed');
                descBox.querySelector('.desc-box-title').onclick = () => descBox.classList.toggle('collapsed');
                videoContainer.appendChild(descBox);

                /* GPS-punkt */
                const gpsBox = document.createElement('div');
                gpsBox.className = 'gps-box';
                gpsBox.innerHTML = `<div class="gps-rad"><span>📍</span><span class="gps-koord">${fmtKoord(sted.gps)}</span><button type="button" class="gps-kopier">Kopier</button></div>`;
                const kopierBtn = gpsBox.querySelector('.gps-kopier');
                kopierBtn.onclick = () => {
                    navigator.clipboard.writeText(fmtKoord(sted.gps)).then(() => {
                        kopierBtn.textContent = 'Kopiert!';
                        setTimeout(() => { kopierBtn.textContent = 'Kopier'; }, 2000);
                    }).catch(err => console.error('Kunne ikke kopiere:', err));
                };
                videoContainer.appendChild(gpsBox);

                /* Tilkomst: ett eller flere spor (GPX i mappen gpx/) fra parkering til klatrestedet */
                const t = sted.tilkomst || {};
                const sporListe = hentSporListe(t);
                if (sporListe.length) {
                    const alle = sporListe.map((sp, i) => ({
                        sp, paa: true, segs: null, lag: null,
                        farge: sp.farge || SPOR_FARGER[i % SPOR_FARGER.length],
                        tittel: sp.tittel || ('Spor ' + (i + 1))
                    }));
                    const tilpassKart = () => {
                        const b = L.latLngBounds([[sted.gps.lat, sted.gps.lng]]);
                        alle.forEach(e => { if (e.lag && map.hasLayer(e.lag)) b.extend(e.lag.getBounds()); });
                        map.fitBounds(b, { padding: [50, 50] });
                    };
                    const visLag = e => {
                        if (!e.lag) return;
                        e.lag.addTo(map);
                        if (!aktiveEkstraLag.includes(e.lag)) aktiveEkstraLag.push(e.lag);
                    };

                    /* Flere spor: bryterne ligger side om side på samme linje */
                    const sporRad = document.createElement('div');
                    sporRad.className = 'spor-rad';
                    alle.forEach((e, i) => {
                        const rad = skapKontrollRad(alle.length > 1 ? 'Spor ' + (i + 1) : 'Tilkomst', true, on => {
                            e.paa = on;
                            if (!e.lag) return;
                            if (on) visLag(e);
                            else { map.removeLayer(e.lag); aktiveEkstraLag = aktiveEkstraLag.filter(x => x !== e.lag); }
                        }, e.farge);
                        sporRad.appendChild(rad);
                    });
                    videoContainer.appendChild(sporRad);

                    Promise.all(alle.map(e => hentSporSegmenter(e.sp).then(segs => {
                        e.segs = segs;
                        e.lag = byggSporLag(segs, e.farge, e.tittel);
                    }).catch(err => console.warn('Kunne ikke laste GPX: ' + (e.sp.gpx || ''), err)))).then(() => {
                        if (token !== aktiveringsTeller) return;     // brukeren har byttet sted i mellomtiden
                        const foerste = alle.find(e => e.segs && e.segs.length);
                        if (foerste) { sted._parkering = { lat: foerste.segs[0][0][0], lng: foerste.segs[0][0][1] }; settVeiLenke(); }
                        alle.forEach(e => { if (e.paa) visLag(e); });
                        tilpassKart();
                    });

                    if (t.beskrivelse) {
                        const tb = document.createElement('div');
                        tb.className = 'desc-box';
                        tb.innerHTML = `<div class="desc-box-title"><span>🥾</span> Tilkomst<span class="chev">▼</span></div><div class="desc-box-body">${t.beskrivelse}</div>`;
                        if (window.matchMedia('(max-width: 768px)').matches) tb.classList.add('collapsed');
                        tb.querySelector('.desc-box-title').onclick = () => tb.classList.toggle('collapsed');
                        videoContainer.appendChild(tb);
                    }

                    const medGpx = alle.filter(e => e.sp.gpx);
                    if (medGpx.length) {
                        const dlArea = document.createElement('div');
                        dlArea.className = 'download-area';
                        const dlHeader = document.createElement('div');
                        dlHeader.className = 'download-header';
                        dlHeader.innerHTML = '<span>💾</span> Last ned GPX<span class="chev">▼</span>';
                        dlHeader.onclick = () => { dlArea.classList.toggle('open'); justerLenkeKnapper(); };
                        dlArea.appendChild(dlHeader);
                        const linksCont = document.createElement('div');
                        linksCont.className = 'download-links-container';
                        medGpx.forEach(e => {
                            const a = document.createElement('span');
                            a.className = 'dl-link';
                            a.innerText = medGpx.length > 1 ? e.tittel : 'Tilkomst';
                            a.onclick = () => lastNedGPX('gpx/' + e.sp.gpx, `${sted.navn}_${e.tittel.replace(/\s+/g, '_')}`);
                            linksCont.appendChild(a);
                        });
                        dlArea.appendChild(linksCont);
                        videoContainer.appendChild(dlArea);
                    }
                }

                justerLenkeKnapper();
                map.flyTo([sted.gps.lat, sted.gps.lng], 15, { duration: 0.8 });
            };
        }

        /* Lenkeknapper og lukket GPX-boks ligger to og to; ved oddetall får den siste full bredde */
        function justerLenkeKnapper() {
            const hent = sel => Array.from(videoContainer.querySelectorAll(':scope > ' + sel));
            const celler = [...hent('.video-link-btn, .search-link-btn'), ...hent('.download-area:not(.open)')];
            celler.forEach(b => b.classList.remove('btn-full'));
            if (celler.length % 2 === 1) celler[celler.length - 1].classList.add('btn-full');
        }

        /* ---------- URL-parameter ---------- */
        function sjekkURLParameter() {
            const p = new URLSearchParams(window.location.search);
            const v = (p.get('sted') || '').toLowerCase().trim();
            const treff = v ? steder.find(t => t.id === v || t.navn.toLowerCase() === v) : null;
            if (treff && knapperMap[treff.id] && knapperMap[treff.id].aktiver) knapperMap[treff.id].aktiver();
            else visOversikt();
        }

        /* ---------- Last stedene fra topropsolo.json ---------- */
        const tpEl = document.getElementById('track-progress');
        const tpLabel = document.getElementById('tpLabel');
        fetch('topropsolo.json')
            .then(res => { if (!res.ok) throw new Error('Fant ikke topropsolo.json'); return res.json(); })
            .then(data => {
                steder = (Array.isArray(data) ? data : data.steder || []).filter(s => s && s.gps && typeof s.gps.lat === 'number' && typeof s.gps.lng === 'number');
                steder.sort((a, b) => a.navn.localeCompare(b.navn, 'no'));
                byggStedKnapper();

                const listEl = document.getElementById('stedList');
                steder.forEach(s => { const o = document.createElement('option'); o.value = s.navn; listEl.appendChild(o); });

                steder.forEach(sted => {
                    const m = L.marker([sted.gps.lat, sted.gps.lng], { icon: lagKlatreIkon(), keyboard: true, title: sted.navn }).addTo(markerGroup);
                    m.bindTooltip(sted.navn, { direction: 'top', offset: [0, -20], className: 'sted-tip' });
                    markorMap[sted.id] = m;
                    const aktiver = lagAktiver(sted);
                    knapperMap[sted.id].aktiver = aktiver;
                    m.on('click', e => { L.DomEvent.stopPropagation(e); aktiver(); });
                });

                tpLabel.textContent = steder.length + ' steder lastet';
                setTimeout(() => tpEl.classList.add('done'), 600);
                sjekkURLParameter();
            })
            .catch(err => {
                console.error('Kunne ikke laste topropsolo.json:', err);
                tpLabel.textContent = 'Kunne ikke laste steder';
                tpEl.querySelector('.tp-fill').style.animation = 'none';
            });

        /* ---------- Søk ---------- */
        const searchInput = document.getElementById('topSearchInput');
        function utførSøk() {
            const v = searchInput.value.toLowerCase().trim();
            if (!v) return;
            const treff = steder.find(t => t.navn.toLowerCase() === v) || steder.find(t => t.navn.toLowerCase().includes(v));
            if (treff && knapperMap[treff.id] && knapperMap[treff.id].aktiver) knapperMap[treff.id].aktiver();
        }
        searchInput.addEventListener('change', utførSøk);
        searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') utførSøk(); });

        /* ---------- Nullstill ---------- */
        document.getElementById('resetBtn').onclick = () => {
            isReseting = true; aktiveringsTeller++; aktivtStedNavn = null; videoContainer.innerHTML = ''; settKartModus('oversikt');
            searchInput.value = '';
            const cleanUrl = window.location.protocol + '//' + window.location.host + window.location.pathname;
            window.history.pushState({ path: cleanUrl }, '', cleanUrl);
            document.querySelectorAll('.letter-btn').forEach(el => el.classList.remove('active'));
            avbrytHover(); lukkAlleDropdowns();
            map.closePopup();
            fjernEkstraLag();
            Object.keys(markorMap).forEach(id => markorMap[id].setIcon(lagKlatreIkon()));
            visOversikt();
            setTimeout(() => isReseting = false, 300);
        };
    </script>

    <script>
/* ===== SPRÅKBRYTER NO / EN (innebygd) =====
   Norsk er originalspråket. Eksakte tekster slås opp i ORDBOK, tekst med tall tas av REGLER.
   Valgt språk huskes i localStorage («lang») og deles med de andre sidene.
   Mangler en tekst i ORDBOK, vises den på norsk. Legg den til nedenfor. */
(function () {
    'use strict';

    var ORDBOK = {
        'Top Rope Solo - Tromsø': 'Top Rope Solo - Tromsø',
        'Nullstill kart': 'Reset map',
        'Marker': 'Select',
        'Marker et område du vil zoome til (dra en firkant med musen)': 'Select an area to zoom to (drag a rectangle with the mouse)',
        'Topografi': 'Topography',
        'Bratthet': 'Steepness',
        'Hellingsvinkel': 'Slope angle',
        'Over 45°': 'Over 45°',
        'Norgeskart': 'Norway map',
        'Søk etter klatrested...': 'Search for a climbing area...',
        'Søk etter klatrested': 'Search for a climbing area',
        'Laster steder …': 'Loading areas …',
        'Kunne ikke laste steder': 'Could not load areas',
        'Dra en firkant over området du vil zoome til · Esc avbryter': 'Drag a rectangle over the area you want to zoom to · Esc to cancel',
        'Fjellturer sommer': 'Summer mountain hikes',
        'Toppturer vinter': 'Winter summit trips',
        'Oversikt turer': 'Trip overview',
        'Skjul meny': 'Hide menu',
        'Vis meny': 'Show menu',
        'Del': 'Share',
        'Kopiert!': 'Copied!',
        'Kopier': 'Copy',
        'Vis': 'Show',
        'Veibeskrivelse': 'Driving directions',
        'Info om klatrestedet': 'Climbing area info',
        'Lukk': 'Close',
        'Åpne i ny fane': 'Open in new tab',
        'Startadresse': 'Start address',
        'Vis rute': 'Show route',
        'Min posisjon': 'My location',
        'Klatrefører Tromsø': 'Climbing guide Tromsø',
        'Brattskala': 'Steepness scale',
        'Skala': 'Scale',
        'Tilkomst': 'Approach',
        'Start': 'Start',
        'Last ned GPX': 'Download GPX',
        'Kommer mer info snart...': 'More info coming soon...',
        'Kvitkuken': 'Kvitkuken',
        'Korteidet TRS beta': 'Korteidet TRS beta',
        'Sjurfjellet Linjer': 'Sjurfjellet Lines',
        'Video 1': 'Video 1'
    };

    var REGLER = [
        [/^Veibeskrivelse til (.+)$/g, 'Driving directions to $1'],
        [/^(\d+) steder lastet$/g, '$1 areas loaded'],
        [/^Tilkomst spor (\d+)$/g, 'Approach track $1'],
        [/^Spor (\d+)$/g, 'Track $1']
    ];

    function oversett(tekst) {
        if (!tekst) return tekst;
        var m = /^(\s*)([\s\S]*?)(\s*)$/.exec(tekst);
        var kjerne = m[2];
        if (!kjerne) return tekst;
        if (Object.prototype.hasOwnProperty.call(ORDBOK, kjerne)) return m[1] + ORDBOK[kjerne] + m[3];
        var ut = kjerne;
        for (var i = 0; i < REGLER.length; i++) ut = ut.replace(REGLER[i][0], REGLER[i][1]);
        return ut === kjerne ? tekst : m[1] + ut + m[3];
    }

    var lang = 'no';
    try {
        var url = new URLSearchParams(location.search).get('lang');
        var lagret = localStorage.getItem('lang');
        lang = (url === 'en' || url === 'no') ? url : (lagret === 'en' ? 'en' : 'no');
    } catch (_) { lang = /[?&]lang=en/.test(location.search) ? 'en' : 'no'; }

    var tekstMinne = new WeakMap();
    var attrMinne = new WeakMap();
    var ATTR = ['title', 'placeholder', 'aria-label', 'alt'];
    var hopp = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1, NOSCRIPT: 1 };
    var observer = null;

    function tekstNode(n) {
        var p = n.parentNode;
        if (p && hopp[p.nodeName]) return;
        var rec = tekstMinne.get(n), cur = n.nodeValue;
        if (rec && cur === rec.en) { if (lang === 'no') n.nodeValue = rec.no; return; }
        if (lang === 'en') {
            var en = oversett(cur);
            if (en !== cur) { tekstMinne.set(n, { no: cur, en: en }); n.nodeValue = en; }
            else tekstMinne.delete(n);
        } else tekstMinne.delete(n);
    }

    function attributter(el) {
        if (!el.getAttribute) return;
        var rek = attrMinne.get(el);
        for (var i = 0; i < ATTR.length; i++) {
            var a = ATTR[i];
            if (!el.hasAttribute(a)) continue;
            var cur = el.getAttribute(a), r = rek && rek[a];
            if (r && cur === r.en) { if (lang === 'no') el.setAttribute(a, r.no); continue; }
            if (lang === 'en') {
                var en = oversett(cur);
                if (en !== cur) {
                    if (!rek) { rek = {}; attrMinne.set(el, rek); }
                    rek[a] = { no: cur, en: en };
                    el.setAttribute(a, en);
                } else if (rek) delete rek[a];
            } else if (rek) delete rek[a];
        }
    }

    function gjennom(rot) {
        if (!rot) return;
        if (rot.nodeType === 3) { tekstNode(rot); return; }
        if (rot.nodeType !== 1 && rot.nodeType !== 9 && rot.nodeType !== 11) return;
        if (rot.nodeType === 1) { if (hopp[rot.nodeName]) return; attributter(rot); }
        var tw = document.createTreeWalker(rot, NodeFilter.SHOW_ELEMENT | NodeFilter.SHOW_TEXT, null);
        var n;
        while ((n = tw.nextNode())) {
            if (n.nodeType === 3) tekstNode(n); else if (!hopp[n.nodeName]) attributter(n);
        }
    }

    function start() {
        if (observer) return;
        observer = new MutationObserver(function (muts) {
            for (var i = 0; i < muts.length; i++) {
                var m = muts[i];
                if (m.type === 'characterData') tekstNode(m.target);
                else if (m.type === 'attributes') attributter(m.target);
                else for (var j = 0; j < m.addedNodes.length; j++) gjennom(m.addedNodes[j]);
            }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTR });
    }

    function oppdaterKnapp() {
        var b = document.getElementById('langBtn');
        if (!b) return;
        var kode = b.querySelector('.lang-code');
        if (kode) kode.textContent = lang === 'en' ? 'NO' : 'EN';
        b.setAttribute('aria-label', lang === 'en' ? 'Bytt til norsk' : 'Switch to English');
        b.setAttribute('title', lang === 'en' ? 'Bytt til norsk' : 'Switch to English');
    }

    function sett(nytt) {
        lang = nytt;
        try { localStorage.setItem('lang', lang); } catch (_) {}
        document.documentElement.lang = lang === 'en' ? 'en' : 'no';
        if (observer) observer.disconnect();
        gjennom(document.documentElement);
        observer = null; start();
        oppdaterKnapp();
        try { document.dispatchEvent(new CustomEvent('langchange', { detail: lang })); } catch (_) {}
    }

    window.__lang = function () { return lang; };
    window.__oversett = oversett;
    window.__setLang = sett;

    function init() {
        var b = document.getElementById('langBtn');
        if (b) b.addEventListener('click', function () { sett(lang === 'en' ? 'no' : 'en'); });
        document.documentElement.lang = lang === 'en' ? 'en' : 'no';
        if (lang === 'en') gjennom(document.documentElement);
        start();
        oppdaterKnapp();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
    </script>

    <script>
    /* ===== MARKER OMRÅDE FOR Å ZOOME (pc): trykk «Marker», dra en firkant, kartet zoomer til den. Esc avbryter. ===== */
    (function () {
        const btn = document.getElementById('markerBtn');
        const beholder = document.getElementById('map-container');
        if (!btn || !beholder) return;
        let modus = false, start = null, boks = null, hint = null, hintTimer = null;

        function fjernHint() { clearTimeout(hintTimer); if (hint) { hint.remove(); hint = null; } }
        function avbryt() { if (boks) { boks.remove(); boks = null; } start = null; }
        function slaPa(pa) {
            modus = pa;
            btn.classList.toggle('active', pa);
            beholder.classList.toggle('marker-modus', pa);
            fjernHint();
            if (pa) {
                map.dragging.disable();
                hint = document.createElement('div');
                hint.className = 'marker-hint';
                hint.textContent = 'Dra en firkant over området du vil zoome til · Esc avbryter';
                beholder.appendChild(hint);
                hintTimer = setTimeout(fjernHint, 3500);
            } else {
                map.dragging.enable();
                avbryt();
            }
        }
        function punkt(e) {
            const r = map.getContainer().getBoundingClientRect();
            return { x: Math.min(Math.max(e.clientX - r.left, 0), r.width), y: Math.min(Math.max(e.clientY - r.top, 0), r.height) };
        }
        function tegn(p) {
            if (!boks || !start) return;
            boks.style.left = Math.min(start.x, p.x) + 'px';
            boks.style.top = Math.min(start.y, p.y) + 'px';
            boks.style.width = Math.abs(p.x - start.x) + 'px';
            boks.style.height = Math.abs(p.y - start.y) + 'px';
        }

        btn.addEventListener('click', () => slaPa(!modus));

        beholder.addEventListener('mousedown', e => {
            if (!modus || e.button !== 0 || e.target.closest('.leaflet-control, #video-buttons-container, #track-progress')) return;
            e.preventDefault();
            e.stopPropagation();
            start = punkt(e);
            boks = document.createElement('div');
            boks.className = 'marker-boks';
            beholder.appendChild(boks);
            tegn(start);
        }, true);
        window.addEventListener('mousemove', e => { if (start) tegn(punkt(e)); });
        window.addEventListener('mouseup', e => {
            if (!start) return;
            const a = start, b = punkt(e);
            avbryt();
            if (Math.abs(b.x - a.x) < 12 || Math.abs(b.y - a.y) < 12) return;
            const sw = map.containerPointToLatLng(L.point(Math.min(a.x, b.x), Math.max(a.y, b.y)));
            const ne = map.containerPointToLatLng(L.point(Math.max(a.x, b.x), Math.min(a.y, b.y)));
            slaPa(false);
            map.fitBounds(L.latLngBounds(sw, ne));
        });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && modus) slaPa(false); });
    })();
    </script>
</body>
